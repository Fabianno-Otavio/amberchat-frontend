<section>
  <form nz-form [formGroup]="form" nzLayout="vertical">
    <nz-form-item>
      <nz-form-label nzFor="name" nzRequired >Nome</nz-form-label>
      <nz-form-control nzErrorTip="Nome é obrigatório">
        <input
          nz-input
          name="name"
          type="text"
          id="name"
          formControlName="name"
        />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzFor="org">Organização</nz-form-label>
      <nz-form-control>
        <nz-select
          name="org"
          id="org"
          formControlName="orgId"
        >
          @for (org of data.organizations; track $index) {
            <nz-option [nzLabel]="org.nome" [nzValue]="org.id"> </nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="color">Cor</nz-form-label>
      <nz-form-control>
        <input nz-input type="color" name="color" id="color" formControlName="color" />
      </nz-form-control>
    </nz-form-item>
  </form>
</section>
<nz-divider style="width: 100%"></nz-divider>
<button
  nz-button
  nzType="primary"
  style="position: absolute; bottom: 10px; right: 16px"
  (click)="emitOk.next(form.value)"
  [disabled]="form.invalid"
>
  Ok
</button>
